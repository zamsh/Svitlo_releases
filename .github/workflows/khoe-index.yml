name: Kharkiv address index

# Keeps khoe-index/index.json in sync with Kharkivoblenergo's "Адреси та черги" PDF (address -> sub-queue).
# Daily: find the current PDF through the site's file API; if it changed, rebuild, validate and commit the
# index. If the document can't be found or parsed, the old index stays and one issue is opened with the report.
on:
  schedule:
    - cron: "47 4 * * *"          # 06:47 / 07:47 Kyiv time
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the documents are unchanged"
        type: boolean
        default: false

concurrency:
  group: khoe-index
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  index:
    # Self-hosted runner on a Mac in Ukraine: PDFKit and CoreGraphics (macOS) read the table text and rules.
    runs-on: [self-hosted, macOS, svitlo-ua]
    steps:
      - uses: actions/checkout@v7

      - name: Parser tests
        run: python3 -m unittest discover -s khoe-index/tests

      - name: Find and download the current document
        id: source
        run: |
          URL=$(python3 khoe-index/tools/find_source.py | python3 -c 'import json,sys;print(json.load(sys.stdin)["url"])')
          curl -sSfL -A "Mozilla/5.0 (SvitloIndexBot)" "$URL" -o "$RUNNER_TEMP/doc.pdf"
          SHA=$(shasum -a 256 "$RUNNER_TEMP/doc.pdf" | cut -d' ' -f1)
          OLD=$(python3 -c 'import json;print(json.load(open("khoe-index/meta.json")).get("sha256",""))' 2>/dev/null || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ "$SHA" = "$OLD" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Document unchanged"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New document: $URL"
          fi

      - name: Build and validate
        id: build
        if: steps.source.outputs.changed == 'true'
        run: |
          python3 khoe-index/tools/build.py --pdf "$RUNNER_TEMP/doc.pdf" --url "${{ steps.source.outputs.url }}" \
            --out khoe-index --previous khoe-index/index.json --work "$RUNNER_TEMP/khoe-work"

      - name: Commit the new index
        if: steps.source.outputs.changed == 'true' && steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add khoe-index/index.json khoe-index/meta.json khoe-index/report.json
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "Kharkiv index: $(python3 -c 'import sys,urllib.parse,os;print(os.path.basename(urllib.parse.unquote(sys.argv[1])))' "${{ steps.source.outputs.url }}")"
          # The AltStore release and the other index workflows also push to main.
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

      - name: Open an issue when the index can't be updated
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Kharkiv index update failed"
          gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' | grep -q . && exit 0
          {
            echo "Source: ${{ steps.source.outputs.url || 'not found (file API changed?)' }}"
            echo
            echo "The previous index was kept. Report:"
            echo '```json'
            cat khoe-index/report.json 2>/dev/null || echo "no report (build crashed, see the run log)"
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
